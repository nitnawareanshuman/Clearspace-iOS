name: iOS build and safety tests
on:
  push:
    branches: [main, bonus]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build iPhone simulator app
        run: xcodebuild -project Clearspace.xcodeproj -scheme Clearspace -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Choose an installed iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/clearspace-devices.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/clearspace-devices.json'))
          devices = [d for runtime, values in data['devices'].items() if 'iOS' in runtime for d in values if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not devices:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SIMULATOR_ID=' + devices[0]['udid'] + '\n')
          PY
      - name: Run safety-rule tests
        run: xcodebuild -project Clearspace.xcodeproj -scheme Clearspace -destination "platform=iOS Simulator,id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult test
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
